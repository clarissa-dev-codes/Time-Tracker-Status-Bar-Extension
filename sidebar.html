<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${cspSource} https:; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
        <style>
            body{
                padding: 15px;
                font-family: var(--vscode-font-family);
                color: var(--vscode-foreground);
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .clock-container{
                font-size: 2rem;
                font-weight: bold;
                font-family: monospace;
                margin-top: 15px;
                padding: 10px 20px;
                border-radius: 6px;
                background: var(--vscode-editor-background);
                border: 1px solid var(--vscode-widget-border);
                transition: opacity 0.3s ease;
            }
            .clock-container.idle{
                opacity: 0.4;
            }
            .status-badge{
                margin-top: 10px;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                padding: 2px 8px;
                border-radius: 4px;
                margin-bottom: 25px;
            }
            .status-badge.active{
                background: #28a745;
                color: white;
            }
            .status-badge.idle{
                background: #dc3545;
                color: white;
            }

            /* --- Mascot Container --- */
            .mascot-container{
                margin-top: 10px;
                margin-bottom: 25px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            .mascot-image{
                width: 120px;
                height: 120px;
                object-fit: contain;
                transition: all 0.3s ease;
                animation: hoverEffect 3s infinite ease-in-out;
            }
            .mascot-speech{
                font-size: 0.85rem;
                opacity: 0.8;
                background: var(--vscode-menu-background);
                border: 1px solid var(--vscode-widget-border);
                padding: 6px 14px;
                border-radius: 12px;
                text-align: center;
                max-width: 180px;
            }

            /* -- floating animation -- */
            @keyframes hoverEffect{
                0%, 100% {transform: translateY(0);}
                50% {transform: translateY(-5px);}
            }

            .stats-container{
                width: 100%;
                max-width: 240px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .stat-row{
                display: flex;
                justify-content: space-between;
                padding: 6px 10px;
                border-radius: 4px;
                background: var(--vscode-sideBar-background);
                border: 1px solid var(--vscode-widget-border);
                font-size: 0.9rem;
            }
            .extension-label{
                font-weight: bold;
                color: var(--vscode-textLink-foreground);
            }
        </style>
    </head>
    <body>
        <h3>Session Time</h3>
        <div class="clock-container" id="clock">00:00:00</div>
        <div class="status-badge active" id="status">Active</div>

        <div class="mascot-container">
            <img class="mascot-image" id="mascotImg" src="${activeMascotUri}" alt="Mascot">
            <div class="mascot-speech" id="mascotSpeech">Let's write some code!</div>
        </div>

        <!-- Pomodoro Control Panel UI -->
        <div style="margin-bottom: 20px;">
            <button id="pomoBtn" style="background: var(--vscode-button-background); color: var(--vscode-button-foreground);
                border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Start 25m Focus
            </button>
        </div>

        <h4>Languages Breakdown</h4>
        <div class="stats-container" id="statsList">
            <div style="text-align: center; opacity: 0.5;">No active file metrics yet.</div>
        </div>

        <script>
            const vscode = acquireVsCodeApi();

            const clockEl = document.getElementById('clock');
            const statusEl = document.getElementById('status');
            const statsListEl = document.getElementById('statsList');
            
            const mascotImgEl = document.getElementById('mascotImg');
            const mascotSpeechEl = document.getElementById('mascotSpeech');
            const pomoBtnEl = document.getElementById('pomoBtn');

            const activeSrc = "${activeMascotUri}";
            const idleSrc = "${idleMascotUri}";

            // FIX: Updated variable name to pomoBtnEl to match declaration above
            pomoBtnEl.addEventListener('click', () => {
                vscode.postMessage({command: 'startPomodoro' });
            });

            window.addEventListener('message', event => {
                const message = event.data;
                if (message.type === 'updateState') {
                    clockEl.textContent = message.time;

                    // --- Pomodoro Text & Speech State --- //
                    if(message.isPomoActive){
                        pomoBtnEl.textContent = 'Focus: ' + message.pomoTime;
                        pomoBtnEl.style.opacity = '0.85';
                    }
                    else{
                        pomoBtnEl.textContent = 'Start 25m Focus';
                        pomoBtnEl.style.opacity = '1';
                    }
                    
                    if (message.isIdle) {
                        clockEl.classList.add('idle');
                        statusEl.textContent = 'Idle (Paused)';
                        statusEl.className = 'status-badge idle';
                        
                        mascotImgEl.src = idleSrc;
                        mascotSpeechEl.textContent = 'Taking a quick break...';
                        mascotImgEl.style.animation = 'none'; 
                        mascotImgEl.style.opacity = '0.6';
                    } else {
                        clockEl.classList.remove('idle');
                        statusEl.textContent = 'Active';
                        statusEl.className = 'status-badge active';
                        
                        mascotImgEl.src = activeSrc;
                        mascotImgEl.style.animation = 'hoverEffect 3s infinite ease-in-out';
                        mascotImgEl.style.opacity = '1';

                        if(message.isPomoActive){
                            mascotSpeechEl.textContent = "Shhh... I'm locked in!";
                        }
                        else{
                            mascotSpeechEl.textContent = 'Keep it up! Doing great!';
                        }
                    }

                    if (message.stats && message.stats.length > 0) {
                        statsListEl.innerHTML = ''; 
                        message.stats.forEach(item => {
                            const row = document.createElement('div');
                            row.className = 'stat-row';
                            row.innerHTML = `
                                <span class="extension-label">${item.extension}</span>
                                <span>${item.timeStr}</span>
                            `;
                            statsListEl.appendChild(row);
                        });
                    }
                }
            });
        </script>
    </body>
</html>
